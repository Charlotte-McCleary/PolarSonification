<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Simple JS Audio Example</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
  </head>
  <body>
  <button id="play-btn-1">Play</button>
    <script type="text/javascript">
        function playTone(frequency) {
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          osc.frequency.setValueAtTime(frequency, ctx.currentTime);
          osc.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 1);
        }
        document.getElementById('play-btn-1').addEventListener('click', () => playTone(440));
    </script>
  <button id = "play-btn-2">Play Circle Sonification</button>
  <button id = "play-btn-3"> Play Ellipse Sonification</button>
  <button id = "play-btn-4"> Play Spiral Sonification</button>

  <script src = "polarSoni.js"></script>

  <script type = "text/javascript">
    function playCircle(){
      sonify(theta => 1)
    };

    document
      .getElementById("play-btn-2")
      .addEventListener('click', playCircle);

    function playEllipse(){
      sonify(theta => 1 + 0.4 * Math.cos(theta))

    };

    document
    .getElementById("play-btn-3")
    .addEventListener("click", () => 
    sonify(theta => 1 + 0.4 * Math.cos(theta)));

    function playSpiral(){
      sonify(theta => 0.2 + theta/ (2 * Math.PI))
    };

    document
    .getElementById("play-btn-4")
    .addEventListener("click", playSpiral)


  </script>
  </body>
</html>
